services:
  - type: web
    name: campuspilot-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://campuspilot-ai.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: ASSEMBLYAI_API_KEY
        sync: false
